<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <clipPath id="squircleClip">
      <rect x="28" y="28" width="456" height="456" rx="108"/>
    </clipPath>

    <linearGradient id="bgObsidian" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090c15"/>
      <stop offset="52%" stop-color="#0f1526"/>
      <stop offset="100%" stop-color="#06080e"/>
    </linearGradient>

    <linearGradient id="rimStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.48"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.38"/>
    </linearGradient>

    <!-- Soft Layered Ambient Aura -->
    <radialGradient id="auraCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.42"/>
      <stop offset="42%" stop-color="#6366f1" stop-opacity="0.24"/>
      <stop offset="76%" stop-color="#2dd4bf" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#0f1526" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auraUpperRight" cx="66%" cy="30%" r="44%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#818cf8" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="auraLowerLeft" cx="32%" cy="70%" r="44%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#0ea5e9" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="auraRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="lcTextGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>

    <filter id="ringBlur" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>

    <filter id="letterAura" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Obsidian Rounded Squircle Frame -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="url(#bgObsidian)"/>

  <!-- Atmospheric Multi-Tone Aura Wash -->
  <g clip-path="url(#squircleClip)">
    <rect x="28" y="28" width="456" height="456" fill="url(#auraCenter)"/>
    <rect x="28" y="28" width="456" height="456" fill="url(#auraUpperRight)"/>
    <rect x="28" y="28" width="456" height="456" fill="url(#auraLowerLeft)"/>
  </g>

  <!-- Soft Luminous Aura Halo Ring -->
  <circle cx="256" cy="256" r="164" fill="none" stroke="url(#auraRingGrad)" stroke-width="11" opacity="0.50" filter="url(#ringBlur)"/>
  <circle cx="256" cy="256" r="164" fill="none" stroke="url(#auraRingGrad)" stroke-width="3" opacity="0.86"/>

  <!-- Outer Squircle Rim -->
  <rect x="28" y="28" width="456" height="456" rx="108" fill="none" stroke="url(#rimStroke)" stroke-width="4"/>

  <!-- Luminous Aura Behind LC -->
  <g filter="url(#letterAura)" opacity="0.68">
    <path d="M 158 192 L 158 310 Q 158 320 168 320 L 220 320" fill="none" stroke="url(#auraRingGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 354 206 C 336 178 270 182 270 256 C 270 330 336 334 354 306" fill="none" stroke="url(#auraRingGrad)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Crisp Simple LC Monogram (Optically Centered) -->
  <path d="M 158 192 L 158 310 Q 158 320 168 320 L 220 320" fill="none" stroke="url(#lcTextGrad)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 354 206 C 336 178 270 182 270 256 C 270 330 336 334 354 306" fill="none" stroke="url(#lcTextGrad)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
