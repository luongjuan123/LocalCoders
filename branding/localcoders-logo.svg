<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="mainAgentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="subagentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="criticGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Shield -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Code Brackets Background -->
  <!-- Left Bracket < -->
  <path d="M 170 160 L 90 256 L 170 352" fill="none" stroke="url(#bracketGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <!-- Right Bracket > -->
  <path d="M 342 160 L 422 256 L 342 352" fill="none" stroke="url(#bracketGrad)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>

  <!-- Multi-Agent Interconnected Neural Core -->
  <!-- Connection Lines between Agents -->
  <line x1="256" y1="170" x2="185" y2="310" stroke="#64748b" stroke-width="8" stroke-dasharray="8 8" opacity="0.8"/>
  <line x1="256" y1="170" x2="327" y2="310" stroke="#64748b" stroke-width="8" stroke-dasharray="8 8" opacity="0.8"/>
  <line x1="185" y1="310" x2="327" y2="310" stroke="#64748b" stroke-width="8" stroke-dasharray="8 8" opacity="0.8"/>

  <!-- Main Agent (Center Top Node) -->
  <circle cx="256" cy="170" r="44" fill="url(#mainAgentGrad)" filter="url(#glow)"/>
  <path d="M 244 150 L 268 150 M 256 150 L 256 190 M 246 190 L 266 190" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>

  <!-- Subagents (Bottom Left Node) -->
  <circle cx="185" cy="310" r="36" fill="url(#subagentGrad)" filter="url(#glow)"/>
  <!-- Subagent icon symbol -->
  <circle cx="185" cy="310" r="14" fill="none" stroke="#ffffff" stroke-width="5"/>
  <circle cx="185" cy="310" r="4" fill="#ffffff"/>

  <!-- Critic Agent (Bottom Right Node) -->
  <circle cx="327" cy="310" r="36" fill="url(#criticGrad)" filter="url(#glow)"/>
  <!-- Shield/Check/Critique symbol -->
  <path d="M 315 308 L 324 317 L 341 298" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central Pulse Ring -->
  <circle cx="256" cy="260" r="16" fill="#38bdf8" opacity="0.9" filter="url(#glow)"/>
</svg>
